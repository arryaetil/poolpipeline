<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Mapbox 3D Render</title>
  <link href="https://api.mapbox.com/mapbox-gl-js/v3.6.0/mapbox-gl.css" rel="stylesheet">
  <script src="https://api.mapbox.com/mapbox-gl-js/v3.6.0/mapbox-gl.js"></script>
  <style>
    html, body, #map { margin: 0; padding: 0; width: 100vw; height: 100vh; overflow: hidden; }
  </style>
</head>
<body>
<div id="map"></div>
<script>
(async () => {
  const p = new URLSearchParams(location.search);
  const token       = p.get('token');
  const lat         = parseFloat(p.get('lat'));
  const lng         = parseFloat(p.get('lng'));
  const heading     = parseFloat(p.get('heading'));  // 0/90/180/270 — orbit position
  const cesiumPitch = parseFloat(p.get('pitch'));    // negative, e.g. -50
  const range       = parseFloat(p.get('range'));    // metres

  // Cesium pitch (-90=straight down, 0=horizontal) → Mapbox pitch (0=top-down, 85=near-horizontal)
  const mapboxPitch   = Math.min(75, Math.max(0, 90 + cesiumPitch));
  // Cesium heading = where camera sits in orbit → Mapbox bearing = direction camera faces
  const mapboxBearing = (heading + 180) % 360;
  // Approximate zoom from range
  const zoom = Math.max(15.5, Math.min(18.5, 19.5 - Math.log2(range / 15)));

  mapboxgl.accessToken = token;

  const map = new mapboxgl.Map({
    container: 'map',
    style: 'mapbox://styles/mapbox/satellite-v9',
    center: [lng, lat],
    zoom: zoom,
    pitch: mapboxPitch,
    bearing: mapboxBearing,
    antialias: true,
    interactive: false,
    fadeDuration: 0,
  });

  map.on('load', () => {
    map.addSource('dem', {
      type: 'raster-dem',
      url: 'mapbox://mapbox.mapbox-terrain-dem-v1',
      tileSize: 512,
      maxzoom: 14,
    });
    map.setTerrain({ source: 'dem', exaggeration: 1.0 });

    const firstSymbol = map.getStyle().layers.find(l => l.type === 'symbol')?.id;
    map.addLayer({
      id: '3d-buildings',
      source: 'composite',
      'source-layer': 'building',
      filter: ['==', 'extrude', 'true'],
      type: 'fill-extrusion',
      minzoom: 15,
      paint: {
        'fill-extrusion-color': '#c9b99a',
        'fill-extrusion-height': ['interpolate', ['linear'], ['zoom'], 15, 0, 15.05, ['get', 'height']],
        'fill-extrusion-base':   ['interpolate', ['linear'], ['zoom'], 15, 0, 15.05, ['get', 'min_height']],
        'fill-extrusion-opacity': 0.85,
      },
    }, firstSymbol);

    // Poll until tiles are stable, then signal ready
    let stable = 0;
    const deadline = Date.now() + 25000;
    (function tick() {
      if (map.loaded() && !map.isMoving()) {
        stable++;
        if (stable >= 20 || Date.now() > deadline) {
          setTimeout(() => { window.__ready = true; }, 600);
          return;
        }
      } else {
        stable = 0;
      }
      requestAnimationFrame(tick);
    })();
  });
})();
</script>
</body>
</html>
